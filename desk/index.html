<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Northwall Research: independent equity research on North American oil and gas, and metals and mining."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Northwall Desk</title><meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a calm brokerage-app shell. Light header with pill navigation, big numbers first, soft grey cards, details below. */
:root{
  --bg:#FFFFFF; --surface:#F5F6F8; --raised:#FFFFFF; --ink:#0E1726; --muted:#687588; --faint:#9AA4B2; --line:#E6E9EE; --soft:#ECEFF3;
  --accent:#0E1726; --accent-ink:#FFFFFF; --brand:#2F5D7C; --brand-soft:#E3ECF3;
  --heat:#E0A526; --up:#0A8458; --down:#C43D37; --warn:#A2650E; --up-bg:#E2F3EB; --down-bg:#F8E5E3; --warn-bg:#F6ECDA;
  --good:var(--up); --bad:var(--down); --good-bg:var(--up-bg); --bad-bg:var(--down-bg);
  --shadow:0 1px 2px rgba(14,23,38,.05),0 4px 16px rgba(14,23,38,.05);
  --sans:"Figtree",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:var(--sans); --body:var(--sans);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-lg:20px; --r-md:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E14; --surface:#131921; --raised:#1A212B; --ink:#EDF1F6; --muted:#93A0B1; --faint:#677487; --line:#232C38; --soft:#1C242F;
  --accent:#EDF1F6; --accent-ink:#0A0E14; --brand:#8DB4D3; --brand-soft:#1A2A3A;
  --heat:#F2C23A; --up:#37C489; --down:#F07B74; --warn:#E3A94F; --up-bg:#12291F; --down-bg:#341A1A; --warn-bg:#30250F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E14; --surface:#131921; --raised:#1A212B; --ink:#EDF1F6; --muted:#93A0B1; --faint:#677487; --line:#232C38; --soft:#1C242F;
  --accent:#EDF1F6; --accent-ink:#0A0E14; --brand:#8DB4D3; --brand-soft:#1A2A3A;
  --heat:#F2C23A; --up:#37C489; --down:#F07B74; --warn:#E3A94F; --up-bg:#12291F; --down-bg:#341A1A; --warn-bg:#30250F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--ink);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* header */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
header.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.lock{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.lock .w1{font-weight:700;letter-spacing:.2em;font-size:13.5px;line-height:1}
.lock .w2{font-size:8.5px;letter-spacing:.5em;color:var(--muted);margin-top:4px;font-weight:600}
nav.tabs{display:flex;gap:2px;margin-left:auto;background:var(--surface);border-radius:999px;padding:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
nav.tabs a{color:var(--muted);text-decoration:none;padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:background .15s,color .15s}
nav.tabs a:hover{color:var(--ink)}
nav.tabs:empty{display:none}
nav.tabs a[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
@media (max-width:760px){nav.tabs{margin-left:0;width:100%}}
.deckline{display:flex;gap:6px;flex-wrap:wrap;width:100%;font-variant-numeric:tabular-nums}
@media (max-width:760px){.deckline{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.deckline span{white-space:nowrap}}
.deckline span{font-size:12px;color:var(--muted);background:var(--surface);border-radius:999px;padding:3px 10px}
.deckline span b{color:var(--ink);font-weight:600}
.deckline .live{color:var(--up);background:var(--up-bg);font-weight:600}
main{padding-block:28px 64px}
/* type */
h1{font-weight:700;font-size:30px;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-weight:700;font-size:19px;margin:0 0 12px;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 12px;letter-spacing:-.005em}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
.sub{color:var(--muted);margin-top:6px}
.note{font-size:12.5px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* layout */
.grid{display:grid;gap:16px;align-items:start}
.g2{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:20px;min-width:0}
.scroll{overflow-x:auto}
.section{margin-bottom:16px}
/* tables */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);text-align:right;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
td.l,th.l{text-align:left}
tr.click{cursor:pointer}
/* pills, buttons */
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.Buy{background:var(--up-bg);color:var(--up)} .Hold{background:var(--warn-bg);color:var(--warn)} .Sell{background:var(--down-bg);color:var(--down)}
.ok{color:var(--up);font-weight:600} .no{color:var(--down);font-weight:600}
.up{color:var(--up)} .down{color:var(--down)}
.tag{font-size:11.5px;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 8px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:600;font-size:13.5px;text-decoration:none;transition:transform .1s,opacity .15s}
.btn:hover{opacity:.88} .btn:active{transform:scale(.98)}
.btn.ghost{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.panel .btn.ghost{background:var(--raised)}
.btn:disabled{opacity:.45;cursor:default}
.banner{background:var(--brand-soft);color:var(--ink);border-radius:var(--r-md);padding:12px 16px;font-size:13.5px}
/* desk hero + holdings list */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.hero .big{font-size:52px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums;margin-top:6px}
.hero .big small{font-size:22px;letter-spacing:-.01em;margin-left:2px}
.hero .chg{margin-top:10px;font-weight:600;font-size:15px}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.count{background:var(--surface);border-radius:var(--r-md);padding:12px 16px;min-width:96px}
.count .k{font-size:12px;color:var(--muted)} .count .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.holdings{background:var(--surface);border-radius:var(--r-lg);padding:6px 8px;margin-bottom:16px}
.hrow{display:grid;grid-template-columns:44px minmax(0,1.6fr) 80px repeat(3,minmax(0,.8fr)) 28px;gap:14px;align-items:center;padding:14px 12px;border-radius:var(--r-md);cursor:pointer;text-decoration:none;color:inherit;font-variant-numeric:tabular-nums}
.hrow:hover{background:var(--raised);box-shadow:var(--shadow)}
.hrow.head{cursor:default;padding-block:8px;font-size:12px;color:var(--muted)} .hrow.head:hover{background:none;box-shadow:none}
.hrow .r{text-align:right}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--raised);color:var(--brand);box-shadow:inset 0 0 0 1px var(--line)}
.hrow .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .nm>span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.show-s{display:none}
.hrow .ret{font-weight:700;font-size:16px}
.hrow .chev{color:var(--faint);text-align:right}
.hrow .sm{display:block;font-size:12px;color:var(--muted);font-weight:500}
@media (max-width:700px){.hrow{grid-template-columns:40px minmax(0,1fr) auto;gap:12px}.hrow .hide-s{display:none}.show-s{display:inline}.hrow.head{display:none}}
.feed{padding:0;margin:0;display:flex;flex-direction:column}
.feed li{list-style:none;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.feed li:last-child{border-bottom:0}
.feed .when{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;min-width:74px}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0}
/* company */
.cohead{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:24px}
.price{font-size:46px;font-weight:700;letter-spacing:-.035em;line-height:1;margin-top:14px;font-variant-numeric:tabular-nums}
.pricesub{margin-top:10px;font-size:15px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;min-width:0}
.tile .k{font-size:12.5px;color:var(--muted)} .tile .v{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.chartcard{background:var(--surface);border-radius:var(--r-lg);padding:20px 20px 16px;margin-bottom:16px}
.chartcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.readout .v{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.readout .k{font-size:13px;color:var(--muted)} .readout .k.up{color:var(--up);font-weight:600} .readout .k.down{color:var(--down);font-weight:600}
.chart{width:100%;display:block;margin-top:12px;touch-action:pan-y;cursor:crosshair}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.slider{display:flex;align-items:center;gap:14px;margin-top:8px}
.slider input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto}
.kv div{padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv div:nth-last-child(-n+2){border-bottom:0}
.kv div:nth-child(even){text-align:right;font-weight:600}
.src{font-size:12px;color:var(--muted);white-space:normal;max-width:360px;text-align:left}
.edit{font-size:12px;padding:4px 12px}
details.inputs summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.inputs summary::-webkit-details-marker{display:none}
details.inputs summary::after{content:"Show";font-size:13px;font-weight:600;color:var(--muted)}
details.inputs[open] summary::after{content:"Hide"}
/* agents */
.agents{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px}
@media (max-width:860px){.agents{grid-template-columns:minmax(0,1fr)}}
.roles{display:flex;flex-direction:column;gap:6px}
@media (max-width:860px){.roles{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.role{display:flex;gap:12px;align-items:flex-start;border:0;background:transparent;border-radius:var(--r-md);padding:12px;text-align:left;cursor:pointer;min-width:220px}
.role:hover{background:var(--surface)}
.role[aria-pressed="true"]{background:var(--surface)}
.role .av{flex:none;width:36px;height:36px}
.role[aria-pressed="true"] .av{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.role b{display:block;font-size:14.5px;font-weight:600}
.role span.d{font-size:12.5px;color:var(--muted);line-height:1.4}
.chat{display:flex;flex-direction:column;gap:12px;min-width:0}
.log{display:flex;flex-direction:column;gap:12px;min-height:320px;max-height:60vh;overflow-y:auto;padding:4px 2px}
.msg{max-width:88%;padding:11px 15px;border-radius:20px;line-height:1.55;min-width:0;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--raised);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.msg.a p{margin:0 0 8px} .msg.a p:last-child{margin:0}
.msg.a ul{margin:4px 0 8px;padding-left:18px}
.msg .work{font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin-top:10px;padding-top:8px;white-space:pre-wrap}
.msg table{font-size:12.5px;margin:6px 0} .msg td,.msg th{padding:4px 8px}
.composer{display:flex;gap:8px;align-items:flex-end;background:var(--raised);border-radius:24px;padding:6px 6px 6px 16px;box-shadow:inset 0 0 0 1px var(--line)}
.composer textarea{flex:1;min-width:0;min-height:40px;max-height:180px;border:0;outline:0;padding:9px 0;background:transparent;resize:none}
.composer .btn{padding:9px 16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.chip:hover{background:var(--soft)}
/* note view */
.notepaper{background:var(--surface);border-radius:var(--r-lg);padding:28px;max-width:920px}
.notepaper .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
@media (max-width:700px){.notepaper .cols{grid-template-columns:minmax(0,1fr)}}
.notepaper h4{font-size:15px;margin:0 0 6px}
.notepaper p{margin:0 0 10px}
.rbox{display:grid;grid-template-columns:repeat(4,auto);gap:4px 24px;background:var(--raised);padding:12px 16px;border-radius:var(--r-md)}
@media (max-width:560px){.rbox{grid-template-columns:repeat(2,auto)}}
.rbox .k{font-size:12px;color:var(--muted)} .rbox .v{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.status{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.st-Draft{background:var(--soft);color:var(--muted)} .st-Approved{background:var(--up-bg);color:var(--up)} .st-Blocked{background:var(--down-bg);color:var(--down)} .st-Published{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.field input,.field select,.field textarea{border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:9px 12px;background:var(--raised);color:var(--ink);font-size:14px}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px}
/* market tape */
.tape{display:flex;align-items:center;border-top:1px solid var(--line);font-size:12.5px;height:34px;overflow:hidden}
.tstamp{flex:none;padding:0 12px 0 max(16px,env(safe-area-inset-left,0px));color:var(--muted);font-size:11.5px;white-space:nowrap;border-right:1px solid var(--line);height:100%;display:flex;align-items:center;background:var(--bg);position:relative;z-index:1}
.tviewport{flex:1;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.ttrack{display:flex;width:max-content;animation:tape var(--dur,40s) linear infinite}
.tape:hover .ttrack{animation-play-state:paused}
.tdup{display:flex}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ttrack{animation:none}.tviewport{overflow-x:auto}.tdup{display:none}}
.ti{display:inline-flex;gap:7px;align-items:baseline;padding:0 18px;white-space:nowrap;border-right:1px solid var(--line)}
.tn{color:var(--muted)} .tp{font-weight:600;color:var(--ink)} .tc{font-size:11.5px;font-weight:600}
.mt .tc{margin-left:8px;font-size:12.5px}
.pubbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:8px;font-size:13px;border-top:1px solid var(--line);max-width:none;background:var(--brand-soft)}
.btn.sm{padding:6px 14px;font-size:12.5px}
/* calendar heatmap */
.heatwrap{overflow-x:auto;padding:12px 0 4px;scrollbar-width:thin}
.heat{display:grid;grid-template-rows:auto repeat(7,auto);gap:3px;min-width:640px}
@media (max-width:700px){.heat{min-width:880px}}
.hm{display:contents} .hm span{grid-row:1;font-size:11px;color:var(--muted);white-space:nowrap;padding-bottom:2px}
.hd{grid-column:1;font-size:10.5px;color:var(--muted);padding-right:8px;align-self:center;line-height:1}
.hc{display:block;aspect-ratio:1;width:100%;border:0;padding:0;border-radius:3px;cursor:pointer;background:color-mix(in srgb,var(--heat) 26%,var(--soft))}
.hc.fut{background:var(--soft)}
.hc.l1{background:color-mix(in srgb,var(--heat) 50%,var(--soft))}
.hc.l2{background:color-mix(in srgb,var(--heat) 75%,var(--soft))}
.hc.l3{background:var(--heat)}
.hc.today{box-shadow:0 0 0 2px var(--ink)}
.hc.sel{box-shadow:0 0 0 2px var(--up)}
.hc:hover{filter:brightness(.92)} .hc:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.hlegend{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.hlegend .hc{width:12px;height:12px;cursor:default}
.hdetail{margin-top:10px;font-size:13.5px}
.hdetail:empty{display:none}
/* desk, minimal */
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sec{margin-bottom:40px}
.label{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--ink);margin-bottom:2px}
.fine{font-size:12px;color:var(--faint);margin:12px 0 0}
table.cov th{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-block:0 10px}
table.cov td{padding-block:15px;font-size:15px}
table.cov td:last-child{font-weight:600}
table.cov tr.click:hover td{background:var(--surface)}
table.cov tr.grp td{padding:22px 0 8px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
table.cov tr.grp:first-child td{padding-top:14px}
table.cov tr.grp a{color:var(--muted);text-decoration:none} table.cov tr.grp a:hover{color:var(--ink)}
.cn{font-weight:600} .ct{color:var(--muted);font-size:12.5px;margin-left:8px}
.flag{margin-left:8px;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:1px 8px}

<script>
// Northwall model engine (JavaScript port of tools/engine.py + archetypes). Pure functions.
const NW = (() => {
  const P = ['2025A', 'H1-26A', 'H2-26E', '2026E', '2027E', '2028E', '2029E', '2030E'];
  const F = ['2027E', '2028E', '2029E', '2030E'];
  const num = (v) => {
    if (typeof v === 'number') return v;
    if (typeof v === 'string' && /^=[\d.+\-*/() ]+$/.test(v)) return Function('"use strict";return (' + v.slice(1) + ')')();
    return v == null ? undefined : Number(v);
  };
  const ser = (c, k, p) => { const s = c.series[k]; return s && s.values[p] != null ? num(s.values[p]) : undefined; };
  const sc = (c, k, deck) => {
    if (c.scalars[k]) return num(c.scalars[k].value);
    if (deck.scalars[k]) return num(deck.scalars[k].value);
    throw new Error('missing scalar ' + k);
  };
  const dk = (deck, k, p) => num(deck.series[k].values[p]);
  const mround = (x, m) => Math.round(x / m) * m;
  const L = () => ({});
  const sumH = (o) => (o['H1-26A'] ?? 0) + (o['H2-26E'] ?? 0);
  const prev = { 'H2-26E': 'H1-26A', '2027E': '2026E', '2028E': '2027E', '2029E': '2028E', '2030E': '2029E' };

  function royalty(c, deck) {
    const S = (k) => sc(c, k, deck), m = {};
    ['geo', 'gold', 'rev', 'cos', 'ga', 'ebitda', 'da', 'fin', 'pretax', 'taxes', 'ni', 'shares', 'eps', 'ocf', 'cfps', 'fcff', 'dps', 'divpaid', 'acq', 'cash', 'netdebt', 'equity'].forEach(k => m[k] = L());
    for (const p of P) m.shares[p] = ser(c, 'shares', p);
    for (const p of ['2025A', 'H1-26A']) {
      m.geo[p] = ser(c, 'geo', p); m.rev[p] = ser(c, 'revenue_act', p); m.cos[p] = ser(c, 'cos_act', p); m.ga[p] = ser(c, 'ga_act', p);
      m.ebitda[p] = ser(c, 'ebitda_act', p); m.da[p] = ser(c, 'da_act', p); m.ni[p] = ser(c, 'ni_act', p); m.ocf[p] = ser(c, 'ocf_act', p);
      m.cash[p] = ser(c, 'cash_act', p); m.equity[p] = ser(c, 'equity_act', p); m.dps[p] = ser(c, 'dps', p);
    }
    for (const p of ['H2-26E', ...F]) {
      m.geo[p] = ser(c, 'geo', p); m.gold[p] = dk(deck, 'gold', p);
      m.rev[p] = m.geo[p] * m.gold[p] * S('realization') / 1000; m.cos[p] = m.rev[p] * S('cos_pct'); m.ga[p] = ser(c, 'ga', p);
      m.ebitda[p] = m.rev[p] - m.cos[p] - m.ga[p]; m.da[p] = m.geo[p] * ser(c, 'da_per_geo', p) / 1000; m.fin[p] = ser(c, 'fin_income', p);
      m.pretax[p] = m.ebitda[p] - m.da[p] + m.fin[p]; m.taxes[p] = m.pretax[p] * S('tax_rate'); m.ni[p] = m.pretax[p] - m.taxes[p];
      m.ocf[p] = m.ebitda[p] + m.fin[p] - S('cash_tax_share') * m.taxes[p]; m.dps[p] = ser(c, 'dps', p);
      m.divpaid[p] = m.dps[p] * m.shares[p]; m.acq[p] = ser(c, 'acquisitions', p);
      if (p === 'H2-26E') { m.cash[p] = m.cash['H1-26A'] + m.ocf[p] - m.divpaid[p] - m.acq[p]; m.equity[p] = m.equity['H1-26A'] + m.ni[p] - m.divpaid[p]; }
    }
    for (const k of ['geo', 'rev', 'cos', 'ga', 'ebitda', 'da', 'ni', 'ocf', 'dps']) m[k]['2026E'] = sumH(m[k]);
    m.cash['2026E'] = m.cash['H2-26E']; m.equity['2026E'] = m.equity['H2-26E'];
    for (const p of F) { m.cash[p] = m.cash[prev[p]] + m.ocf[p] - m.divpaid[p] - m.acq[p]; m.equity[p] = m.equity[prev[p]] + m.ni[p] - m.divpaid[p]; m.fcff[p] = m.ocf[p]; }
    for (const p of P) { if (m.ni[p] != null) m.eps[p] = m.ni[p] / m.shares[p]; if (m.ocf[p] != null) m.cfps[p] = m.ocf[p] / m.shares[p]; if (m.cash[p] != null) m.netdebt[p] = -m.cash[p]; }
    // NAV
    let port = 0, opt = 0, geo = 0;
    for (let y = 2027; y <= 2060; y++) {
      const lbl = y + 'E';
      geo = y <= 2030 ? m.geo[lbl] : (y <= 2035 ? S('nav_flat_geo') : geo * (1 - S('nav_decline')));
      const gold = y <= 2030 ? dk(deck, 'gold', lbl) : S('gold_lt');
      const ebitda = geo * gold * S('realization') / 1000 * (1 - S('cos_pct')) - S('nav_ga');
      const df = 1 / Math.pow(1 + S('nav_disc'), y - 2026 - 0.5);
      port += ebitda * (1 - S('nav_cash_tax')) * df;
      if (y >= S('cobre_start') && y <= 2050) opt += S('cobre_geo') * S('gold_lt') * S('realization') / 1000 * (1 - S('cos_pct')) * (1 - S('nav_cash_tax')) * df;
    }
    const nav = port + opt * S('cobre_prob') + S('nav_exploration') + m.cash['2026E'] + S('investments');
    const navps = nav / S('nav_shares');
    return { m, extra: { navps, cobre_ps: opt * S('cobre_prob') / S('nav_shares'), cobre_full_ps: opt / S('nav_shares'), nav_port: port },
      v1: navps * S('mult1'), v2: m.cfps['2027E'] * S('mult2'),
      methods: ['P/NAV', 'P/CF 2027E'], metrics: [navps, m.cfps['2027E']] };
  }

  function goldProducer(c, deck) {
    const S = (k) => sc(c, k, deck), m = {};
    ['oz', 'gold', 'aisc', 'margin', 'rev', 'aisc_m', 'taxes', 'shares', 'eps', 'ni', 'ocf', 'cfps', 'sust', 'growth', 'expl', 'fcf', 'fcff', 'dps', 'divpaid', 'buyback', 'netdebt', 'equity'].forEach(k => m[k] = L());
    for (const p of P) m.shares[p] = ser(c, 'shares', p);
    for (const p of ['2025A', 'H1-26A']) {
      m.oz[p] = ser(c, 'oz', p); m.gold[p] = ser(c, 'gold_real_act', p); m.aisc[p] = ser(c, 'aisc', p); m.rev[p] = ser(c, 'rev_act', p);
      m.eps[p] = ser(c, 'eps_act', p); m.ocf[p] = ser(c, 'ocf_act', p); m.fcf[p] = ser(c, 'fcf_act', p); m.dps[p] = ser(c, 'dps', p);
    }
    m.netdebt['H1-26A'] = ser(c, 'netdebt_act', 'H1-26A'); m.equity['H1-26A'] = ser(c, 'equity_act', 'H1-26A');
    for (const p of ['H2-26E', ...F]) {
      m.oz[p] = ser(c, 'oz', p); m.gold[p] = dk(deck, 'gold', p); m.aisc[p] = ser(c, 'aisc', p);
      m.rev[p] = m.oz[p] * m.gold[p] / 1000;
      m.eps[p] = (m.gold[p] - m.aisc[p] - S('da_excess')) * m.oz[p] / 1000 * (1 - S('mining_tax')) / m.shares[p];
      m.dps[p] = ser(c, 'dps', p);
    }
    for (const p of ['2025A', 'H1-26A', 'H2-26E', ...F]) { m.margin[p] = m.gold[p] - m.aisc[p]; m.aisc_m[p] = m.margin[p] * m.oz[p] / 1000; m.ni[p] = m.eps[p] * m.shares[p]; }
    for (const p of ['H2-26E', ...F]) {
      m.taxes[p] = m.aisc_m[p] * S('mining_tax');
      m.ocf[p] = (m.gold[p] - m.aisc[p] + S('sust_per_oz')) * m.oz[p] / 1000 - m.taxes[p];
      m.sust[p] = S('sust_per_oz') * m.oz[p] / 1000; m.growth[p] = ser(c, 'growth_capex', p); m.expl[p] = ser(c, 'expl', p);
      m.fcf[p] = m.ocf[p] - m.sust[p] - m.growth[p] - m.expl[p];
      m.divpaid[p] = m.dps[p] * m.shares[p]; m.buyback[p] = ser(c, 'buybacks', p);
      const q = prev[p];
      m.netdebt[p] = m.netdebt[q === '2026E' ? '2026E' : q] - m.fcf[p] + m.divpaid[p] + m.buyback[p];
      m.equity[p] = m.equity[q] + m.ni[p] - m.divpaid[p] - m.buyback[p];
      if (p === 'H2-26E') { m.netdebt['2026E'] = m.netdebt[p]; m.equity['2026E'] = m.equity[p]; }
    }
    for (const k of ['oz', 'rev', 'aisc_m', 'eps', 'ni', 'ocf', 'fcf', 'dps']) m[k]['2026E'] = sumH(m[k]);
    m.gold['2026E'] = (m.gold['H1-26A'] * m.oz['H1-26A'] + m.gold['H2-26E'] * m.oz['H2-26E']) / m.oz['2026E'];
    m.aisc['2026E'] = (m.aisc['H1-26A'] * m.oz['H1-26A'] + m.aisc['H2-26E'] * m.oz['H2-26E']) / m.oz['2026E'];
    m.margin['2026E'] = m.gold['2026E'] - m.aisc['2026E'];
    for (const p of P) if (m.ocf[p] != null) m.cfps[p] = m.ocf[p] / m.shares[p];
    for (const p of F) m.fcff[p] = m.fcf[p];
    let port = 0, oz = 0;
    for (let y = 2027; y <= 2050; y++) {
      const lbl = y + 'E', inM = y <= 2030;
      oz = inM ? m.oz[lbl] : (y <= 2036 ? S('nav_flat_oz') : oz * (1 - S('nav_decline')));
      const gold = inM ? dk(deck, 'gold', lbl) : S('gold_lt'), aisc = inM ? m.aisc[lbl] : S('aisc_lt');
      const cf = (gold - aisc) * oz / 1000 * (1 - S('mining_tax')) - (inM ? m.growth[lbl] : 0) - (inM ? m.expl[lbl] : S('expl_lt'));
      port += cf / Math.pow(1 + S('nav_disc'), y - 2026 - 0.5);
    }
    const navps = (port - m.netdebt['2026E']) / S('shares');
    return { m, extra: { navps }, v1: navps * S('mult1'), v2: m.cfps['2027E'] * S('mult2'), methods: ['P/NAV', 'P/CF 2027E'], metrics: [navps, m.cfps['2027E']] };
  }

  function epCashflow(c, deck) {
    const S = (k) => sc(c, k, deck), m = {};
    ['prod', 'days', 'vol', 'wti', 'ffpb', 'ff', 'shares', 'cfps', 'capex', 'fff', 'fffps', 'dacf', 'fcff', 'dps', 'divpaid', 'netdebt'].forEach(k => m[k] = L());
    for (const p of P) m.shares[p] = ser(c, 'shares', p);
    const H = ['H1-26A', 'H2-26E', ...F];
    for (const p of H) { m.prod[p] = ser(c, 'prod', p); m.days[p] = ser(c, 'days', p); m.vol[p] = m.prod[p] * m.days[p] / 1000; m.dps[p] = ser(c, 'dps', p); }
    m.ff['H1-26A'] = ser(c, 'ff_act', 'H1-26A'); m.capex['H1-26A'] = ser(c, 'capex_act', 'H1-26A');
    m.ffpb['H1-26A'] = m.ff['H1-26A'] / m.vol['H1-26A']; m.netdebt['H1-26A'] = ser(c, 'netdebt_act', 'H1-26A');
    for (const p of ['H2-26E', ...F]) {
      m.wti[p] = dk(deck, 'wti', p); m.ffpb[p] = S('ff_anchor') + S('ff_sens') * (m.wti[p] - S('anchor_wti'));
      m.ff[p] = m.vol[p] * m.ffpb[p]; m.capex[p] = ser(c, 'capex', p); m.divpaid[p] = m.dps[p] * m.shares[p];
    }
    for (const p of H) m.fff[p] = m.ff[p] - m.capex[p];
    for (const k of ['days', 'vol', 'ff', 'capex', 'fff', 'dps']) m[k]['2026E'] = sumH(m[k]);
    m.prod['2026E'] = (m.prod['H1-26A'] * m.days['H1-26A'] + m.prod['H2-26E'] * m.days['H2-26E']) / m.days['2026E'];
    m.ffpb['2026E'] = m.ff['2026E'] / m.vol['2026E'];
    m.netdebt['H2-26E'] = m.netdebt['H1-26A'] - m.fff['H2-26E'] + m.divpaid['H2-26E']; m.netdebt['2026E'] = m.netdebt['H2-26E'];
    for (const p of F) { m.netdebt[p] = m.netdebt[prev[p]] - m.fff[p] + m.divpaid[p]; m.fcff[p] = m.fff[p] + S('at_interest'); }
    for (const p of ['2026E', ...F]) m.dacf[p] = m.ff[p] + S('at_interest');
    for (const p of [...H, '2026E']) { m.cfps[p] = m.ff[p] / m.shares[p]; m.fffps[p] = m.fff[p] / m.shares[p]; }
    const sh = S('shares'), nd26 = m.netdebt['2026E'];
    const be = S('anchor_wti') + ((m.dps['2027E'] * m.shares['2027E'] + m.capex['2027E']) / m.vol['2027E'] - S('ff_anchor')) / S('ff_sens');
    return { m, extra: { be_wti: be }, v1: (S('mult1') * m.dacf['2027E'] - nd26) / sh, v2: m.fff['2027E'] / S('mult2') / sh,
      methods: ['EV/DACF 2027E', 'FFF yield 2027E'], metrics: [m.dacf['2027E'], m.fff['2027E']] };
  }

  function oilSands(c, deck) {
    const S = (k) => sc(c, k, deck), m = {};
    ['prod', 'wti', 'ebitda_bbl', 'ebitda', 'interest', 'aff', 'shares', 'cfps', 'capex', 'fcf', 'fcff', 'netdebt', 'lev'].forEach(k => m[k] = L());
    for (const p of ['2025A', '2026E', ...F]) m.prod[p] = ser(c, 'prod', p);
    for (const p of ['2026E', ...F]) m.shares[p] = ser(c, 'shares', p);
    m.aff['2025A'] = ser(c, 'aff_act', '2025A'); m.capex['2025A'] = ser(c, 'capex_act', '2025A'); m.fcf['2025A'] = ser(c, 'fcf_act', '2025A');
    m.netdebt['2026E'] = ser(c, 'netdebt_ye', '2026E');
    for (const p of F) {
      m.wti[p] = dk(deck, 'wti', p); m.ebitda_bbl[p] = S('ebitda_anchor') + S('ebitda_sens') * (m.wti[p] - S('anchor_wti'));
      m.ebitda[p] = m.prod[p] * 365 * m.ebitda_bbl[p] / 1000; m.interest[p] = ser(c, 'interest', p); m.aff[p] = m.ebitda[p] - m.interest[p];
      m.cfps[p] = m.aff[p] / m.shares[p]; m.capex[p] = ser(c, 'capex', p); m.fcf[p] = m.aff[p] - m.capex[p]; m.fcff[p] = m.fcf[p] + m.interest[p];
      m.lev[p] = m.netdebt[prev[p]] / m.ebitda[p]; m.netdebt[p] = m.netdebt[prev[p]] - m.fcf[p];
    }
    const sh = S('shares'), nd26 = m.netdebt['2026E'];
    const navps = (S('pv10_gfr') + S('nav_connacher') - nd26) / sh;
    return { m, extra: { navps }, v1: S('mult1') * navps, v2: (S('mult2') * m.ebitda['2027E'] - nd26) / sh,
      methods: ['P/NAV (2P)', 'EV/EBITDA 2027E'], metrics: [navps, m.ebitda['2027E']] };
  }

  const ARCH = { royalty, gold_producer: goldProducer, ep_cashflow: epCashflow, oil_sands: oilSands };

  function run(c, deck) {
    const S = (k) => sc(c, k, deck);
    const r = ARCH[c.company.archetype](c, deck);
    const m = r.m, price = S('price'), fx = S('fx_price'), sh = S('shares');
    const priceModel = price * fx, mcap = priceModel * sh, ev = mcap + S('netdebt_now');
    const ke = S('rf') + S('beta') * S('erp');
    const dw = S('gross_debt') / (S('gross_debt') + mcap);
    const wacc = ke * (1 - dw) + S('kd') * (1 - S('tax_rate')) * dw;
    const w1 = S('w1'), blend = w1 * r.v1 + (1 - w1) * r.v2, blendPx = blend / fx;
    const target = mround(blendPx, S('round_to'));
    const retPx = target / price - 1, retDiv = S('dps_fwd') / price, retAll = retPx + retDiv;
    const rating = retAll > S('buy_band') ? 'Buy' : (retAll >= 0 ? 'Hold' : 'Sell');
    let pv = 0; F.forEach((p, i) => pv += m.fcff[p] / Math.pow(1 + wacc, i + 1));
    const g = S('g_term'), tv = m.fcff['2030E'] * (1 + g) / (wacc - g), pvTv = tv / Math.pow(1 + wacc, 4);
    const dcfPs = (pv + pvTv - m.netdebt['2026E'] + S('investments')) / sh;
    const gImpl = ke - m.cfps['2027E'] / priceModel;
    let riPs = null, peJust = null;
    if (c.company.has_ri) {
      let s = 0, ri = 0;
      F.forEach((p, i) => { ri = m.ni[p] - ke * m.equity[prev[p]]; s += ri / Math.pow(1 + ke, i + 1); });
      riPs = (m.equity['2026E'] + s + ri / ke / Math.pow(1 + ke, 4)) / sh;
      const payout = m.dps['2027E'] / m.eps['2027E'], roe = m.ni['2027E'] / ((m.equity['2026E'] + m.equity['2027E']) / 2), gs = (1 - payout) * roe;
      peJust = ke > gs ? payout / (ke - gs) : null;
    }
    const out = { ...r.extra, target, rating, ret_all: retAll, ret_px: retPx, ret_div: retDiv, v1: r.v1, v2: r.v2, blend, blend_px: blendPx,
      ke, wacc, dcf_ps: dcfPs, g_impl: gImpl, ri_ps: riPs, pe_just: peJust, price, price_model: priceModel, mcap, ev,
      methods: r.methods, metrics: r.metrics, ccy: c.company.price_ccy, model_ccy: c.company.model_ccy, fx };
    out.checks = checks(c, out, m);
    out.all_checks = out.checks.every(x => x.pass);
    return { out, m };
  }

  function checks(c, o, m) {
    const p = c.published, near = (a, b) => Math.abs(a - b) <= Math.max(0.01, Math.abs(b) * 0.005);
    const L = [['Price target equals the published target', o.target, p.target], ['Rating equals the published rating', o.rating, p.rating]];
    const a = c.company.archetype;
    if (a === 'royalty') L.push(['NAV per share', o.navps, p.navps], ['2026E adjusted EPS', m.eps['2026E'], p.eps_2026], ['2027E CFPS', m.cfps['2027E'], p.cfps_2027]);
    if (a === 'gold_producer') L.push(['NAV per share', o.navps, p.navps], ['2026E adjusted EPS', m.eps['2026E'], p.eps_2026], ['2027E CFPS', m.cfps['2027E'], p.cfps_2027], ['2028E free cash flow', m.fcf['2028E'], p.fcf_2028]);
    if (a === 'ep_cashflow') L.push(['2027E funds flow per share', m.cfps['2027E'], p.cfps_2027], ['2027E free funds flow', m.fff['2027E'], p.fff_2027], ['Net debt, Dec 2026E', m.netdebt['2026E'], p.nd_2026], ['Dividend breakeven WTI', o.be_wti, p.be_wti]);

async function saveScalar(t, key, value, source, role) {
  const cfg = clone(S.coverage[t]); if (!cfg.scalars[key]) throw new Error(`No input named ${key} for ${t}.`);
  if (!String(source || '').trim()) throw new Error('A source or reason is required.');
  const v = NW.num(typeof value === 'string' && value.startsWith('=') ? value : Number(value)); if (v == null || isNaN(v)) throw new Error('Value must be a number.');

async function saveSeries(t, key, period, value, source, role) {

function md(s) {
  const lines = esc(s).split('\n'); let html = '', list = false, table = [];
  const flushT = () => { if (!table.length) return; const rows = table.filter(r => !/^\|?\s*[-:]+\s*(\|\s*[-:]+\s*)*\|?$/.test(r)).map(r => r.replace(/^\||\|$/g, '').split('|').map(x => x.trim()));
    html += `<div class="scroll"><table><thead><tr>${rows[0].map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; table = []; };
  for (let l of lines) {

    if (/^\s*\|/.test(l)) { if (list) { html += '</ul>'; list = false; } table.push(l.trim()); continue; } else flushT();
    if (/^\s*[-*] /.test(l)) { if (!list) { html += '<ul>'; list = true; } html += `<li>${l.replace(/^\s*[-*] /, '')}</li>`; continue; }
    if (list) { html += '</ul>'; list = false; }

  }

}

  return `<div class="cohead"><div><h1>Library</h1><div class="sub">Every published note, newest first, and the Excel model behind each name.</div></div></div>
  <div class="panel scroll" style="margin-bottom:18px"><table><thead><tr><th>Date</th><th>Ticker</th><th class="l">Document</th><th>Rating</th><th>Target</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="empty">No published notes yet.</td></tr>'}</tbody></table></div>
  <div class="panel"><h3>Excel models</h3><div class="row">${models}</div><div class="note" id="dlmsg" style="margin-top:8px">Version v2026Q2, built on Oct 27, 2026. Each workbook has Cover, Inputs, Model, Valuation, NAV, Sensitivity, Ratios, Comps, Checks and Log sheets.</div></div>`;
}
function viewNote(id) {
  const n = S.notes.find(x => x.id === id); if (!n) return `<div class="banner">That note is not available.</div>`;
  const c = S.coverage[n.ticker], s = n.snapshot || {};
  return `<div class="row" style="margin-bottom:14px"><a class="back" href="#library">‹ Library</a><span class="status st-${n.status}">${n.status}</span>${n.review ? `<span class="note">Supervisory review ${esc(n.review.date)}: ${esc(n.review.findings)}</span>` : ''}</div>
  <article class="notepaper"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="note">${esc(c.company.exchange)}: ${n.ticker} · ${esc(n.doc_type)}</div><h1 style="font-size:22px">${esc(c.company.name)}</h1><div class="sub">${esc(n.title)} · Basel Al-Ghousein (Analyst), Northwall Research · ${esc(n.date)}</div></div>
  <div class="rbox"><div><div class="k">Rating</div><div class="v">${s.rating}</div></div><div><div class="k">Price</div><div class="v">${cur(s.ccy)}${fmt(s.price)}</div></div><div><div class="k">Target</div><div class="v">${cur(s.ccy)}${fmt(s.target)}</div></div><div><div class="k">All-in return</div><div class="v">${pct(s.ret_all)}</div></div></div></div>
  <div class="cols" style="margin-top:16px"><div><h4>Investment summary</h4>${n.summary}</div><div><h4>Valuation</h4>${n.valuation}<h4 style="margin-top:12px">Risks to rating and price target</h4>${n.risks}</div></div>
  <p class="note" style="margin-top:14px">Ratings: Buy, expected 12-month total return above 15%; Hold, 0–15%; Sell, below 0%. Facts are from company filings; estimates, target and rating are Northwall Research opinions. The analyst certifies these views are their own. Not investment advice.</p></article>`;
}
function viewCompliance() {
  const log = S.ratinglog.map(x => `<tr><td>${esc(x.date)}</td><td><b>${esc(x.ticker)}</b></td><td class="l">${esc(x.action)}</td><td>${esc(x.old_rating || '–')} → ${esc(x.new_rating)}</td><td>${x.old_target ?? '–'} → ${x.new_target}</td><td>${fmt(x.price)}</td><td class="l" style="white-space:normal">${esc(x.reason)}</td></tr>`).join('');
  const notes = S.notes.map(n => `<tr><td>${esc(n.date)}</td><td><b>${esc(n.ticker)}</b></td><td class="l"><a href="#note-${n.id}">${esc(n.title)}</a></td><td><span class="status st-${n.status}">${n.status}</span></td><td class="l" style="white-space:normal">${esc(n.review ? n.review.findings : '')}</td></tr>`).join('');
  const checks = TICKERS().map(t => { const R = results(t); return `<tr><td><b>${t}</b></td><td>${R && R.out.all_checks ? '<span class="ok">All pass</span>' : '<span class="no">Fail</span>'}</td><td class="l">${R ? R.out.checks.filter(x => !x.pass).map(x => esc(x.label)).join('; ') || '–' : ''}</td></tr>`; }).join('');
  const std = [['V(A) Reasonable basis', 'Model checks pass; every input sourced'], ['V(B) Communication', 'Facts attributed, estimates labelled, risks named'], ['I(B) Independence', 'Rating follows the return bands'], ['I(C) Misrepresentation', 'No other firm’s research copied'], ['V(C) Record retention', 'Nothing deleted; every change logged'], ['VI(A) Conflicts', 'Holdings checked and disclosed'], ['VII(B) CFA references', '“Level II candidate for the CFA designation” only']];
  return `<div class="cohead"><div><h1>Compliance</h1><div class="sub">Every rating change, every review decision and the state of every model.</div></div></div>
  <div class="grid g2" style="margin-bottom:18px"><div class="panel scroll"><h3>Review decisions</h3><table><thead><tr><th>Date</th><th>Ticker</th><th class="l">Note</th><th>Status</th><th class="l">Findings</th></tr></thead><tbody>${notes || '<tr><td colspan="5" class="empty">No notes yet.</td></tr>'}</tbody></table></div>
  <div class="panel"><h3>Model checks</h3><div class="scroll"><table><thead><tr><th>Ticker</th><th>Status</th><th class="l">Failing</th></tr></thead><tbody>${checks}</tbody></table></div>
   <h3 style="margin-top:16px">CFA Standards applied</h3><div class="kv">${std.map(([a, b]) => `<div>${a}</div><div style="font-weight:400;text-align:right;white-space:normal">${b}</div>`).join('')}</div></div></div>
  <div class="panel scroll"><h3>Rating and target log</h3><table><thead><tr><th>Date</th><th>Ticker</th><th class="l">Action</th><th>Rating</th><th>Target</th><th>Price</th><th class="l">Reason</th></tr></thead><tbody>${log || '<tr><td colspan="7" class="empty">No entries yet.</td></tr>'}</tbody></table></div>${DESK_MODE ? `
  <div class="grid g2" style="margin-top:18px">
    <div class="panel"><h3>Website visitors</h3><p class="note" style="margin:0 0 10px">Visits to the public site are counted anonymously by GoatCounter: pages viewed, PDF downloads, where visitors came from (LinkedIn, Google, a direct link), country, browser and device. Individual names are not recorded.</p>
      <a class="btn" href="https://northwall-research.goatcounter.com" target="_blank" rel="noopener">Open visitor dashboard</a></div>
    <div class="panel scroll"><h3>Desk sign-ins</h3>${S.access === undefined ? '<div class="empty">Loading…</div>' : (S.access || []).length ? `<table><thead><tr><th class="l">When (Toronto)</th><th class="l">GitHub user</th><th class="l">Device</th><th class="l">Time zone</th></tr></thead><tbody>${S.access.slice(0, 25).map(x => `<tr><td class="l">${esc(new Date(x.ts).toLocaleString('en-CA', { timeZone: 'America/Toronto', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }))}</td><td class="l"><b>${esc(x.user)}</b></td><td class="l">${esc(x.device)}, ${esc(x.browser)}</td><td class="l">${esc(x.tz)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No sign-ins recorded yet.</div>'}</div>
  </div>` : ''}`;
}
if (!DESK_MODE) render();
</script>
</body></html>
