name: Live site

on:
  push:
    branches: [main]
    paths-ignore: ["data/state.json", "data/access_log.json"]
  schedule:
    - cron: "*/15 11-23 * * 1-5"   # every 15 minutes through the trading day (UTC)
    - cron: "0 */4 * * *"           # every 4 hours otherwise
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - name: Build and deploy the site
        run: tools/deploy_site.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
