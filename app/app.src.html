<title>Northwall Research</title>

<style>
/* Layout: a calm brokerage-app shell. Light header with pill navigation, big numbers first, soft grey cards, details below. */
:root{
  --bg:#FFFFFF; --surface:#F5F6F8; --raised:#FFFFFF; --ink:#0E1726; --muted:#687588; --faint:#9AA4B2; --line:#E6E9EE; --soft:#ECEFF3;
  --accent:#0E1726; --accent-ink:#FFFFFF; --brand:#2F5D7C; --brand-soft:#E3ECF3;
  --up:#0A8458; --down:#C43D37; --warn:#A2650E; --up-bg:#E2F3EB; --down-bg:#F8E5E3; --warn-bg:#F6ECDA;
  --good:var(--up); --bad:var(--down); --good-bg:var(--up-bg); --bad-bg:var(--down-bg);
  --shadow:0 1px 2px rgba(14,23,38,.05),0 4px 16px rgba(14,23,38,.05);
  --sans:"Figtree",-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:var(--sans); --body:var(--sans);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-lg:20px; --r-md:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E14; --surface:#131921; --raised:#1A212B; --ink:#EDF1F6; --muted:#93A0B1; --faint:#677487; --line:#232C38; --soft:#1C242F;
  --accent:#EDF1F6; --accent-ink:#0A0E14; --brand:#8DB4D3; --brand-soft:#1A2A3A;
  --up:#37C489; --down:#F07B74; --warn:#E3A94F; --up-bg:#12291F; --down-bg:#341A1A; --warn-bg:#30250F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E14; --surface:#131921; --raised:#1A212B; --ink:#EDF1F6; --muted:#93A0B1; --faint:#677487; --line:#232C38; --soft:#1C242F;
  --accent:#EDF1F6; --accent-ink:#0A0E14; --brand:#8DB4D3; --brand-soft:#1A2A3A;
  --up:#37C489; --down:#F07B74; --warn:#E3A94F; --up-bg:#12291F; --down-bg:#341A1A; --warn-bg:#30250F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--ink);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* header */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
header.bar .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.lock{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.lock .w1{font-weight:700;letter-spacing:.2em;font-size:13.5px;line-height:1}
.lock .w2{font-size:8.5px;letter-spacing:.5em;color:var(--muted);margin-top:4px;font-weight:600}
nav.tabs{display:flex;gap:2px;margin-left:auto;background:var(--surface);border-radius:999px;padding:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
nav.tabs a{color:var(--muted);text-decoration:none;padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;transition:background .15s,color .15s}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
@media (max-width:760px){nav.tabs{margin-left:0;width:100%}}
.deckline{display:flex;gap:6px;flex-wrap:wrap;width:100%;font-variant-numeric:tabular-nums}
@media (max-width:760px){.deckline{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.deckline span{white-space:nowrap}}
.deckline span{font-size:12px;color:var(--muted);background:var(--surface);border-radius:999px;padding:3px 10px}
.deckline span b{color:var(--ink);font-weight:600}
.deckline .live{color:var(--up);background:var(--up-bg);font-weight:600}
main{padding-block:28px 64px}
/* type */
h1{font-weight:700;font-size:30px;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-weight:700;font-size:19px;margin:0 0 12px;text-wrap:balance;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 12px;letter-spacing:-.005em}

.sub{color:var(--muted);margin-top:6px}
.note{font-size:12.5px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.grid{display:grid;gap:16px;align-items:start}

.banner{background:var(--brand-soft);color:var(--ink);border-radius:var(--r-md);padding:12px 16px;font-size:13.5px}
/* desk hero + holdings list */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.hero .big{font-size:52px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums;margin-top:6px}
.hero .big small{font-size:22px;letter-spacing:-.01em;margin-left:2px}
.hero .chg{margin-top:10px;font-weight:600;font-size:15px}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.count{background:var(--surface);border-radius:var(--r-md);padding:12px 16px;min-width:96px}
.count .k{font-size:12px;color:var(--muted)} .count .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.holdings{background:var(--surface);border-radius:var(--r-lg);padding:6px 8px;margin-bottom:16px}
.hrow{display:grid;grid-template-columns:44px minmax(0,1.6fr) 80px repeat(3,minmax(0,.8fr)) 28px;gap:14px;align-items:center;padding:14px 12px;border-radius:var(--r-md);cursor:pointer;text-decoration:none;color:inherit;font-variant-numeric:tabular-nums}
.hrow:hover{background:var(--raised);box-shadow:var(--shadow)}
.hrow.head{cursor:default;padding-block:8px;font-size:12px;color:var(--muted)} .hrow.head:hover{background:none;box-shadow:none}
.hrow .r{text-align:right}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:var(--raised);color:var(--brand);box-shadow:inset 0 0 0 1px var(--line)}
.hrow .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .nm>span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.show-s{display:none}
.hrow .ret{font-weight:700;font-size:16px}

@media (max-width:700px){.hrow{grid-template-columns:40px minmax(0,1fr) auto;gap:12px}.hrow .hide-s{display:none}.show-s{display:inline}.hrow.head{display:none}}
.feed{padding:0;margin:0;display:flex;flex-direction:column}
.feed li{list-style:none;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.feed li:last-child{border-bottom:0}
.feed .when{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;min-width:74px}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0}
/* company */
.cohead{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:24px}
.price{font-size:46px;font-weight:700;letter-spacing:-.035em;line-height:1;margin-top:14px;font-variant-numeric:tabular-nums}
.pricesub{margin-top:10px;font-size:15px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;min-width:0}
.tile .k{font-size:12.5px;color:var(--muted)} .tile .v{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.chartcard{background:var(--surface);border-radius:var(--r-lg);padding:20px 20px 16px;margin-bottom:16px}
.chartcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.readout .v{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.readout .k{font-size:13px;color:var(--muted)} .readout .k.up{color:var(--up);font-weight:600} .readout .k.down{color:var(--down);font-weight:600}
.chart{width:100%;display:block;margin-top:12px;touch-action:pan-y;cursor:crosshair}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.slider{display:flex;align-items:center;gap:14px;margin-top:8px}

.kv{display:grid;grid-template-columns:minmax(0,1fr) auto}
.kv div{padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv div:nth-last-child(-n+2){border-bottom:0}
.kv div:nth-child(even){text-align:right;font-weight:600}
.src{font-size:12px;color:var(--muted);white-space:normal;max-width:360px;text-align:left}
.edit{font-size:12px;padding:4px 12px}
details.inputs summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.inputs summary::-webkit-details-marker{display:none}

details.inputs[open] summary::after{content:"Hide"}
/* agents */
.agents{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px}
@media (max-width:860px){.agents{grid-template-columns:minmax(0,1fr)}}
.roles{display:flex;flex-direction:column;gap:6px}
@media (max-width:860px){.roles{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.role{display:flex;gap:12px;align-items:flex-start;border:0;background:transparent;border-radius:var(--r-md);padding:12px;text-align:left;cursor:pointer;min-width:220px}
.role:hover{background:var(--surface)}
.role[aria-pressed="true"]{background:var(--surface)}
.role .av{flex:none;width:36px;height:36px}
.role[aria-pressed="true"] .av{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.role b{display:block;font-size:14.5px;font-weight:600}
.role span.d{font-size:12.5px;color:var(--muted);line-height:1.4}
.chat{display:flex;flex-direction:column;gap:12px;min-width:0}
.log{display:flex;flex-direction:column;gap:12px;min-height:320px;max-height:60vh;overflow-y:auto;padding:4px 2px}
.msg{max-width:88%;padding:11px 15px;border-radius:20px;line-height:1.55;min-width:0;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--raised);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.msg.a p{margin:0 0 8px} .msg.a p:last-child{margin:0}
.msg.a ul{margin:4px 0 8px;padding-left:18px}
.msg .work{font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin-top:10px;padding-top:8px;white-space:pre-wrap}
.msg table{font-size:12.5px;margin:6px 0} .msg td,.msg th{padding:4px 8px}
.composer{display:flex;gap:8px;align-items:flex-end;background:var(--raised);border-radius:24px;padding:6px 6px 6px 16px;box-shadow:inset 0 0 0 1px var(--line)}
.composer textarea{flex:1;min-width:0;min-height:40px;max-height:180px;border:0;outline:0;padding:9px 0;background:transparent;resize:none}

.chips{display:flex;gap:6px;flex-wrap:wrap}

.chip:hover{background:var(--soft)}
/* note view */
.notepaper{background:var(--surface);border-radius:var(--r-lg);padding:28px;max-width:920px}
.notepaper .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}

.rbox .k{font-size:12px;color:var(--muted)} .rbox .v{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}

<script>
const SEED = /*SEED*/;
const XLSX = /*XLSX*/;
const LIBRARY_FALLBACK = /*LIB*/;

/* ---------------- state ---------------- */
const S = { deck: SEED.deck, coverage: SEED.coverage, events: [], ratinglog: [], notes: [], library: LIBRARY_FALLBACK, activity: [],
  db: null, user: null, canEdit: false, sample: null, downloads: null, live: false };
const TICKERS = () => Object.keys(S.coverage).sort();
const clone = (o) => JSON.parse(JSON.stringify(o));
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (v, d = 2) => (v == null || isNaN(v)) ? '–' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (v, d = 1) => (v == null || isNaN(v)) ? '–' : (v * 100).toFixed(d) + '%';
const cur = (c) => c === 'CAD' ? 'C$' : 'US$';
const today = () => new Date().toISOString().slice(0, 10);
function results(t, deck) { try { return NW.run(S.coverage[t], deck || S.deck); } catch (e) { return null; } }

/* ---------------- capabilities ---------------- */
(async () => {
  const [db, user, sample, downloads] = await Promise.all(['db', 'user', 'sample', 'downloads'].map(n => window.claude ? claude.use(n).catch(() => null) : null));
  S.user = user; S.sample = sample; S.downloads = downloads;
  try { S.canEdit = user ? !!user.canEdit() : false; } catch (e) { S.canEdit = false; }
  if (db) { S.db = db; subscribe(); }
  render();
})();

function subscribe() {
  const db = S.db;
  db.doc('config/deck').onSnapshot(s => { if (s.exists) { S.deck = clone(s.data()); S.live = true; render(); } });
  db.collection('coverage').onSnapshot(q => { if (!q.empty) { const c = {}; q.docs.forEach(d => c[d.id] = clone(d.data())); S.coverage = c; S.live = true; render(); } });
  const coll = (name, key, order) => db.collection(name).orderBy(order, 'desc').limit(200).onSnapshot(q => { S[key] = q.docs.map(d => ({ id: d.id, ...clone(d.data()) })); render(); });
  coll('events', 'events', 'sort'); coll('ratinglog', 'ratinglog', 'ts'); coll('notes', 'notes', 'ts'); coll('activity', 'activity', 'ts');
  db.collection('library').orderBy('ts', 'desc').limit(200).onSnapshot(q => { if (!q.empty) { S.library = q.docs.map(d => ({ id: d.id, ...clone(d.data()) })); render(); } });
}
async function logActivity(role, text) { if (S.db) await S.db.collection('activity').add({ ts: Date.now(), role, text }); }
function requireDb() { if (!S.db) throw new Error('Saving is unavailable in this view (read-only snapshot). Open the page signed in to claude.ai as an editor.'); if (!S.canEdit) throw new Error('Only editors of this page can save changes.'); }

/* ---------------- routing ---------------- */
const VIEWS = { desk: 'Desk', agents: 'Agents', library: 'Library', compliance: 'Compliance' };
function route() { const h = (location.hash || '#desk').slice(1); return h || 'desk'; }
window.addEventListener('hashchange', render);
function renderTabs(cur) {
  const items = [['desk', 'Desk'], ...TICKERS().map(t => [t.toLowerCase(), t]), ['agents', 'Agents'], ['library', 'Library'], ['compliance', 'Compliance']];
  document.getElementById('tabs').innerHTML = items.map(([h, l]) => `<a href="#${h}" ${h === cur ? 'aria-current="page"' : ''}>${l}</a>`).join('');
  const d = S.deck, g = d.series.gold.values, w = d.series.wti.values;
  document.getElementById('deckline').innerHTML = `<span class="${S.live ? 'live' : ''}">${S.live ? '● Live' : 'Snapshot'}</span><span>Deck ${esc(d.as_of)}</span><span>Gold 27E <b>US$${fmt(g['2027E'], 0)}</b></span><span>Gold LT <b>US$${fmt(d.scalars.gold_lt.value, 0)}</b></span><span>WTI 27E <b>US$${fmt(w['2027E'], 0)}</b></span><span>USD/CAD <b>${fmt(d.series.usdcad.values['2027E'], 2)}</b></span><span>10-yr <b>${pct(d.scalars.rf.value, 2)}</b></span>`;
}
let chatRendered = false;

  const lo = Number(wi.min), hi = Number(wi.max), step = (hi - lo) / 40, price = c.scalars.price.value;
  const pts = []; for (let x = lo; x <= hi + 1e-9; x += step) { const R = results(t, whatIfDeck(t, x)); if (R) pts.push([x, R.out.blend_px]); }
  const houseX = usesGold ? S.deck.series.gold.values['2027E'] : S.deck.series.wti.values['2027E'];
  const svg = document.getElementById('curve'), W = Math.max(300, Math.round(svg.getBoundingClientRect().width) || 720), H = W < 500 ? 200 : 260, L = 46, Rm = 12, T = 14, B = 26;
  const ys = pts.map(p => p[1]).concat([price]); let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * .08 || 1; y0 -= pad; y1 += pad;
  const sx = x => L + (x - lo) / (hi - lo) * (W - L - Rm), sy = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);

  const yt = nice(y0, y1, 4), xt = nice(lo, hi, 5);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join('');

    ${yt.map(v => `<line x1="${L}" x2="${W - Rm}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${sy(v) + 4}" text-anchor="end">${ccy}${fmt(v, 0)}</text>`).join('')}

    <line x1="${sx(houseX)}" x2="${sx(houseX)}" y1="${T}" y2="${H - B}" stroke="var(--faint)" stroke-width="1"/><text x="${sx(houseX) + 6}" y="${T + 10}">House deck</text>
    <path d="${area}" fill="url(#cg)"/><path d="${line}" fill="none" stroke="var(--brand)" stroke-width="2.25" stroke-linejoin="round"/>
    <line id="cx" y1="${T}" y2="${H - B}" stroke="var(--ink)" stroke-width="1" opacity=".35"/><circle id="cd" r="5.5" fill="var(--brand)" stroke="var(--surface)" stroke-width="2.5"/>`;
  const show = (v) => { const R = results(t, whatIfDeck(t, v));
    document.getElementById('wiLbl').textContent = `${usesGold ? 'Gold' : 'WTI'} at US$${fmt(v, 0)}`;
    document.getElementById('wiT').textContent = R ? ccy + fmt(R.out.target) : '–';

    if (R) { const X = sx(v), Y = sy(R.out.blend_px); const cx = document.getElementById('cx'); cx.setAttribute('x1', X); cx.setAttribute('x2', X); const cd = document.getElementById('cd'); cd.setAttribute('cx', X); cd.setAttribute('cy', Y); } };

/* ---------------- writes ---------------- */
async function saveCoverage(t, cfg, role, text) { requireDb(); await S.db.doc('coverage/' + t).set(cfg); await logActivity(role, text); }
async function saveScalar(t, key, value, source, role) {
  const cfg = clone(S.coverage[t]); if (!cfg.scalars[key]) throw new Error(`No input named ${key} for ${t}.`);
  if (!String(source || '').trim()) throw new Error('A source or reason is required.');
  const v = NW.num(typeof value === 'string' && value.startsWith('=') ? value : Number(value)); if (v == null || isNaN(v)) throw new Error('Value must be a number.');
  const old = cfg.scalars[key].value; cfg.scalars[key].value = v; cfg.scalars[key].source = source;
  cfg.log = [{ date: today(), version: cfg.company.version, change: `${key}: ${old} → ${v} (${source})`, effect: '' }, ...(cfg.log || [])];
  await saveCoverage(t, cfg, role, `${t} ${key} ${old} → ${v}`);
}
async function saveSeries(t, key, period, value, source, role) {
  const cfg = clone(S.coverage[t]); if (!cfg.series[key]) throw new Error(`No series named ${key} for ${t}.`);
  if (!NW.P.includes(period)) throw new Error('Period must be one of ' + NW.P.join(', '));
  if (!String(source || '').trim()) throw new Error('A source or reason is required.');
  const v = Number(value); if (isNaN(v)) throw new Error('Value must be a number.');
  const old = cfg.series[key].values[period]; cfg.series[key].values[period] = v;
  cfg.series[key].source = `${cfg.series[key].source} | ${today()} ${period}: ${source}`;
  cfg.log = [{ date: today(), version: cfg.company.version, change: `${key} ${period}: ${old ?? 'blank'} → ${v} (${source})`, effect: '' }, ...(cfg.log || [])];
  await saveCoverage(t, cfg, role, `${t} ${key} ${period} ${old ?? 'blank'} → ${v}`);
}

    if (list) { html += '</ul>'; list = false; }

}

    <div class="log" id="chatlog" aria-live="polite"></div>
    <div class="chips" id="starters"></div>
    <div class="composer"><textarea id="box" placeholder="Ask the ${ROLES[role].name}… paste results text here" aria-label="Message"></textarea>
      <label class="btn ghost" style="cursor:pointer" title="Attach screenshots">＋ Image<input type="file" id="img" accept="image/*" multiple hidden></label>
      <button class="btn" id="send">Send</button><button class="btn ghost" id="stop" hidden>Stop</button></div>
    <div class="note" id="chatnote"></div></div></div>`;
}
function refreshAgentSide() { }
function paintChat() {
  const log = document.getElementById('chatlog'); if (!log) return; const T = loadTurns(role);
  log.innerHTML = T.length ? T.map(t => t.role === 'user' ? `<div class="msg u">${esc(t.content)}</div>` : `<div class="msg a">${md(t.content)}${t.work ? `<div class="work">${esc(t.work)}</div>` : ''}</div>`).join('')
    : `<div class="empty">Start with one of the suggestions below, or ask anything about the coverage.</div>`;
  log.scrollTop = log.scrollHeight;
  document.getElementById('starters').innerHTML = STARTERS[role].map(s => `<button class="chip">${esc(s)}</button>`).join('');
  document.querySelectorAll('#starters .chip').forEach(b => b.addEventListener('click', () => { document.getElementById('box').value = b.textContent; document.getElementById('box').focus(); }));
}
function bindAgents() {
  paintChat();
  document.querySelectorAll('.role').forEach(b => b.addEventListener('click', () => { role = b.dataset.role; document.querySelectorAll('.role').forEach(x => x.setAttribute('aria-pressed', x.dataset.role === role)); document.getElementById('rolename').textContent = ROLES[role].name; document.getElementById('box').placeholder = `Ask the ${ROLES[role].name}…`; paintChat(); }));
  document.getElementById('clear').addEventListener('click', () => { turns[role] = []; saveTurns(role); paintChat(); });
  document.getElementById('img').addEventListener('change', (e) => { pendingImages = [...e.target.files]; document.getElementById('chatnote').textContent = pendingImages.length ? `${pendingImages.length} image(s) attached to your next message.` : ''; });
  document.getElementById('send').addEventListener('click', send);
  document.getElementById('box').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send(); });
  document.getElementById('stop').addEventListener('click', () => ctl && ctl.abort());
}
const ERR = { not_granted: 'Claude access was declined for this page.', rate_limited: 'Too many requests at once. Wait a minute and send again.', tools_unavailable: 'This view cannot run agent tools.', cancelled: 'Stopped.' };
async function send() {
  const box = document.getElementById('box'), text = box.value.trim(); if (!text) return;
  const note = document.getElementById('chatnote');
  if (!S.sample) { note.textContent = 'Agents run only inside claude.ai or the Claude app.'; return; }
  const r = role, T = loadTurns(r); T.push({ role: 'user', content: text }); box.value = ''; saveTurns(r); paintChat();
  const log = document.getElementById('chatlog'); const bubble = document.createElement('div'); bubble.className = 'msg a'; bubble.innerHTML = '<p>Thinking…</p>'; log.appendChild(bubble); log.scrollTop = log.scrollHeight;
  let work = ''; const wk = (s) => { work += (work ? '\n' : '') + '› ' + s; bubble.querySelector('.work') ? bubble.querySelector('.work').textContent = work : bubble.insertAdjacentHTML('beforeend', `<div class="work">${esc(work)}</div>`); };
  const rules = `${ROLES[r].rules}\n\nHouse style for answers: plain sentences, lead with the answer, short; use a small markdown table only for numbers. Currency always labelled US$ or C$.\n\nCURRENT DESK\n${deskContext()}`;
  const input = [{ role: 'user', content: rules }, { role: 'assistant', content: 'Understood. I am ready.' }, ...T.slice(-12).map(t => ({ role: t.role, content: t.content }))];
  ctl = new AbortController(); document.getElementById('send').disabled = true; document.getElementById('stop').hidden = false;
  const opts = { cache: false, signal: ctl.signal, modelTier: 'default', onText: ({ text }) => { bubble.innerHTML = md(text) + (work ? `<div class="work">${esc(work)}</div>` : ''); log.scrollTop = log.scrollHeight; } };
  try {
    const lim = S.sample.limits ? await S.sample.limits() : {}; if (lim && lim.tools) opts.tools = toolsFor(r, wk);
    if (pendingImages.length && lim && lim.images) opts.images = pendingImages;
    const { text: ans } = await S.sample(input, opts);
    T.push({ role: 'assistant', content: ans, work }); saveTurns(r);
  } catch (e) {
    const keep = e && e.text ? e.text : ''; T.push({ role: 'assistant', content: (keep ? keep + '\n\n' : '') + (ERR[e && e.code] || ('The request failed: ' + (e && e.message || 'unknown error'))), work }); saveTurns(r);
  } finally { pendingImages = []; note.textContent = ''; ctl = null; document.getElementById('send').disabled = false; document.getElementById('stop').hidden = true; paintChat(); }
}

/* ---------------- Library, notes, compliance ---------------- */
function viewLibrary() {
  const rows = S.library.map(x => `<tr><td>${esc(x.date)}</td><td><b>${esc(x.ticker)}</b></td><td class="l">${esc(x.doc_type)}${x.title ? ` · ${esc(x.title)}` : ''}</td><td>${x.rating ? `<span class="pill ${x.rating}">${x.rating}</span>` : ''}</td><td>${x.target != null ? cur(x.ccy) + fmt(x.target) : ''}</td>
    <td>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">Open PDF</a>` : `<a href="#note-${x.note_id}">Read note</a>`}</td></tr>`).join('');
  const models = TICKERS().filter(t => XLSX[t]).map(t => `<button class="btn ghost" data-xlsx="${t}">${t} model (Excel)</button>`).join('');
  return `<div class="cohead"><div><h1>Library</h1><div class="sub">Every published note, newest first, and the Excel model behind each name.</div></div></div>
  <div class="panel scroll" style="margin-bottom:18px"><table><thead><tr><th>Date</th><th>Ticker</th><th class="l">Document</th><th>Rating</th><th>Target</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="empty">No published notes yet.</td></tr>'}</tbody></table></div>
  <div class="panel"><h3>Excel models</h3><div class="row">${models}</div><div class="note" id="dlmsg" style="margin-top:8px">Version v2026Q2, built on Oct 27, 2026. Each workbook has Cover, Inputs, Model, Valuation, NAV, Sensitivity, Ratios, Comps, Checks and Log sheets.</div></div>`;
}
function viewNote(id) {
  const n = S.notes.find(x => x.id === id); if (!n) return `<div class="banner">That note is not available.</div>`;
  const c = S.coverage[n.ticker], s = n.snapshot || {};
  return `<div class="row" style="margin-bottom:14px"><a class="back" href="#library">‹ Library</a><span class="status st-${n.status}">${n.status}</span>${n.review ? `<span class="note">Supervisory review ${esc(n.review.date)}: ${esc(n.review.findings)}</span>` : ''}</div>
  <article class="notepaper"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="note">${esc(c.company.exchange)}: ${n.ticker} · ${esc(n.doc_type)}</div><h1 style="font-size:22px">${esc(c.company.name)}</h1><div class="sub">${esc(n.title)} · Basel Al-Ghousein (Analyst), Northwall Research · ${esc(n.date)}</div></div>
  <div class="rbox"><div><div class="k">Rating</div><div class="v">${s.rating}</div></div><div><div class="k">Price</div><div class="v">${cur(s.ccy)}${fmt(s.price)}</div></div><div><div class="k">Target</div><div class="v">${cur(s.ccy)}${fmt(s.target)}</div></div><div><div class="k">All-in return</div><div class="v">${pct(s.ret_all)}</div></div></div></div>
  <div class="cols" style="margin-top:16px"><div><h4>Investment summary</h4>${n.summary}</div><div><h4>Valuation</h4>${n.valuation}<h4 style="margin-top:12px">Risks to rating and price target</h4>${n.risks}</div></div>
  <p class="note" style="margin-top:14px">Ratings: Buy, expected 12-month total return above 15%; Hold, 0–15%; Sell, below 0%. Facts are from company filings; estimates, target and rating are Northwall Research opinions. The analyst certifies these views are their own. Not investment advice.</p></article>`;
}
function viewCompliance() {
  const log = S.ratinglog.map(x => `<tr><td>${esc(x.date)}</td><td><b>${esc(x.ticker)}</b></td><td class="l">${esc(x.action)}</td><td>${esc(x.old_rating || '–')} → ${esc(x.new_rating)}</td><td>${x.old_target ?? '–'} → ${x.new_target}</td><td>${fmt(x.price)}</td><td class="l" style="white-space:normal">${esc(x.reason)}</td></tr>`).join('');
  const notes = S.notes.map(n => `<tr><td>${esc(n.date)}</td><td><b>${esc(n.ticker)}</b></td><td class="l"><a href="#note-${n.id}">${esc(n.title)}</a></td><td><span class="status st-${n.status}">${n.status}</span></td><td class="l" style="white-space:normal">${esc(n.review ? n.review.findings : '')}</td></tr>`).join('');
  const checks = TICKERS().map(t => { const R = results(t); return `<tr><td><b>${t}</b></td><td>${R && R.out.all_checks ? '<span class="ok">All pass</span>' : '<span class="no">Fail</span>'}</td><td class="l">${R ? R.out.checks.filter(x => !x.pass).map(x => esc(x.label)).join('; ') || '–' : ''}</td></tr>`; }).join('');
  const std = [['V(A) Reasonable basis', 'Model checks pass; every input sourced'], ['V(B) Communication', 'Facts attributed, estimates labelled, risks named'], ['I(B) Independence', 'Rating follows the return bands'], ['I(C) Misrepresentation', 'No other firm’s research copied'], ['V(C) Record retention', 'Nothing deleted; every change logged'], ['VI(A) Conflicts', 'Holdings checked and disclosed'], ['VII(B) CFA references', '“Level II candidate for the CFA designation” only']];
  return `<div class="cohead"><div><h1>Compliance</h1><div class="sub">Every rating change, every review decision and the state of every model.</div></div></div>
  <div class="grid g2" style="margin-bottom:18px"><div class="panel scroll"><h3>Review decisions</h3><table><thead><tr><th>Date</th><th>Ticker</th><th class="l">Note</th><th>Status</th><th class="l">Findings</th></tr></thead><tbody>${notes || '<tr><td colspan="5" class="empty">No notes yet.</td></tr>'}</tbody></table></div>
  <div class="panel"><h3>Model checks</h3><div class="scroll"><table><thead><tr><th>Ticker</th><th>Status</th><th class="l">Failing</th></tr></thead><tbody>${checks}</tbody></table></div>
   <h3 style="margin-top:16px">CFA Standards applied</h3><div class="kv">${std.map(([a, b]) => `<div>${a}</div><div style="font-weight:400;text-align:right;white-space:normal">${b}</div>`).join('')}</div></div></div>
  <div class="panel scroll"><h3>Rating and target log</h3><table><thead><tr><th>Date</th><th>Ticker</th><th class="l">Action</th><th>Rating</th><th>Target</th><th>Price</th><th class="l">Reason</th></tr></thead><tbody>${log || '<tr><td colspan="7" class="empty">No entries yet.</td></tr>'}</tbody></table></div>`;
}
render();
</script>
